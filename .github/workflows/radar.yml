name: Refresh Radar & Project Cards

on:
  schedule:
    - cron: "30 3 * * *" # Daily at 03:30 UTC
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate Self-Rated Radar
        run: |
          if [ -f "scripts/radar.py" ] && [ -f "assets/skills.json" ]; then
            python scripts/radar.py --data assets/skills.json -o assets/radar
          fi

      - name: Generate Live Language Radar
        run: |
          if [ -f "scripts/radar.py" ]; then
            python scripts/radar.py --github priyansh-69 -o assets/radar-langs --limit 7 --values --curve 0.4 --exclude "shell,makefile,dockerfile,batchfile,procfile"
          fi

      - name: Generate Stat & Project Cards
        run: |
          if [ -f "scripts/cards.py" ]; then
            python scripts/cards.py --user priyansh-69 --out assets
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh charts and cards [skip ci]"
            git push
          fi
